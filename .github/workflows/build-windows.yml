name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (numeric x.y.z)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  package-win:
    runs-on: windows-2022
    env:
      JAVAFX_VERSION: 21.0.5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '${{ inputs.version }}'
            if (-not $version) { $version = '1.0.0' }
          }
          # Windows installer versions: up to three numeric parts (major.minor.build)
          if ($version -notmatch '^\d{1,3}(\.\d{1,3}(\.\d{1,5})?)?$') {
            Write-Error "Invalid version '$version' — use numeric x.y.z (tag v1.2.3)"
            exit 1
          }
          "APP_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
            $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
            "$($wix.FullName)\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Download JavaFX jmods
        shell: pwsh
        run: |
          $url = "https://download2.gluonhq.com/openjfx/$env:JAVAFX_VERSION/openjfx-${env:JAVAFX_VERSION}_windows-x64_bin-jmods.zip"
          $zip = "$env:RUNNER_TEMP\jmods.zip"
          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "JAVAFX_JMODS=$env:RUNNER_TEMP\javafx-jmods-$env:JAVAFX_VERSION" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Test
        run: mvn -B test

      - name: Build installer
        run: mvn -B clean package -Ppackage-win -DskipTests "-Dapp.version=${{ env.APP_VERSION }}"

      - uses: actions/upload-artifact@v5
        with:
          name: VRCPosterCreator-${{ env.APP_VERSION }}-installer
          path: target/VRCPosterCreator-*.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/VRCPosterCreator-*.exe
          fail_on_unmatched_files: true
